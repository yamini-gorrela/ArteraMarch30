        <template if:true={openWarningMsg}>

                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeWarningModel}></button>

                        </div>

                        </div>
                        <div class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" name="unallocatedlimit" aria-label="Ok" onclick={closeWarningModel}>Ok</button>
                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" ></div>
            </div>
        </template>
        <template if:true={openWarningAlloacte}>

                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" ></div>
            </div>
        </template>

    <lightning-card > 
        
        <div slot="title">
            <lightning-icon icon-name="custom:custom42" size="medium"></lightning-icon>
            <span class="slds-p-left_small" style="float:right ;">

            </span>
            
            
        </div> 
        
            <div class="spinner">

            </div>

                            </td>

                    </td>

                        <div if:false={rowVisit.Unallocation__c} class="slds-truncate" title="Unallocation">$0</div>
